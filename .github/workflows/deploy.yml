name: Deploy to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run lint

      - name: Validate question bank
        run: npm run validate

      - name: Unit tests
        run: npm test

      - name: Check classroom passcode secret
        env:
          VITE_CLASSROOM_PASSCODE: ${{ secrets.CLASSROOM_PASSCODE }}
        run: |
          if [ -z "$VITE_CLASSROOM_PASSCODE" ]; then
            echo "::error::Missing repository secret CLASSROOM_PASSCODE. Add it under Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi

      - name: Build project
        env:
          VITE_CLASSROOM_PASSCODE: ${{ secrets.CLASSROOM_PASSCODE }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
